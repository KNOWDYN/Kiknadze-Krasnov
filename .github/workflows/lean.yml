name: Lean

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Lean project
        uses: leanprover/lean-action@v1
        with:
          use-mathlib-cache: true
      - name: Reject proof placeholders
        shell: bash
        run: |
          if grep -RInE '\b(sorry|admit)\b' --include='*.lean' .; then
            echo 'Forbidden Lean proof placeholder found.'
            exit 1
          fi
