name: Lean

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and pinned Lean toolchain
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build Lean project
        run: lake build
      - name: Reject proof placeholders
        shell: bash
        run: |
          if grep -RInE '\b(sorry|admit)\b' --include='*.lean' KiknadzeKrasnov KiknadzeKrasnov.lean; then
            echo 'Forbidden Lean proof placeholder found.'
            exit 1
          fi
      - name: Audit transitive proof trust
        run: lake env lean scripts/TrustAudit.lean
      - name: Check source coverage
        run: python3 scripts/check_coverage.py

  zenodo_bridge:
    if: github.ref == 'refs/heads/tmp/zenodo-17988010-transfer'
    runs-on: ubuntu-latest
    steps:
      - name: Download exact Zenodo archive
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            --output turbulence_dataset.zip \
            'https://zenodo.org/api/records/17988010/files/turbulence_dataset.zip/content'
          echo 'bbb7a3a49a1d9bd830e3c0318bf23296  turbulence_dataset.zip' | md5sum --check --strict
          ls -lh turbulence_dataset.zip
      - name: Upload verified archive as temporary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-17988010
          path: turbulence_dataset.zip
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
