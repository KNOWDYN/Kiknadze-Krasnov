name: Zenodo dictionary bridge

on:
  push:

permissions:
  contents: read

jobs:
  zenodo_dictionary:
    if: github.ref == 'refs/heads/tmp/zenodo-17988010-transfer'
    runs-on: ubuntu-latest
    steps:
      - name: Download and verify data dictionary
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            --output data_dictionary.csv \
            'https://zenodo.org/api/records/17988010/files/data_dictionary.csv/content'
          echo '64552ab964c9ca318c7caab6a50e08a4  data_dictionary.csv' | md5sum --check --strict
          ls -lh data_dictionary.csv
      - name: Upload verified dictionary artifact
        uses: actions/upload-artifact@v4
        with:
          name: zenodo-17988010-dictionary
          path: data_dictionary.csv
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
