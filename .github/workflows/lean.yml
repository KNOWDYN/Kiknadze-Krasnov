name: Lean

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: lean-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        shell: bash
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Restore Lean and Mathlib cache
        id: lean-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: kk-lean-v4.34.0-rc2-mathlib-8d52ea9a145a9255
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Save Lean and Mathlib cache
        if: steps.lean-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan/toolchains
            .lake/packages
          key: kk-lean-v4.34.0-rc2-mathlib-8d52ea9a145a9255
      - name: Build Lean project
        run: lake build
      - name: Reject proof placeholders
        shell: bash
        run: |
          if grep -RInE '\b(sorry|admit)\b' --include='*.lean' KiknadzeKrasnov KiknadzeKrasnov.lean; then
            echo 'Forbidden Lean proof placeholder found.'
            exit 1
          fi
