name: Lean

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: false
          test: false
          lint: false
          use-mathlib-cache: false
          use-github-cache: false
      - name: Resolve pinned dependencies
        run: lake update
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Build Lean project
        run: lake build
      - name: Reject proof placeholders
        shell: bash
        run: |
          if grep -RInE '\b(sorry|admit)\b' --include='*.lean' .; then
            echo 'Forbidden Lean proof placeholder found.'
            exit 1
          fi
