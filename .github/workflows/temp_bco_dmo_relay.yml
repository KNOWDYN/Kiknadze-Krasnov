name: Temporary BCO-DMO data relay

on:
  push:
    branches:
      - nature-selective-conservation
    paths:
      - '.github/workflows/temp_bco_dmo_relay.yml'

permissions:
  contents: read

env:
  DATA_URL: https://datadocs.bco-dmo.org/dataset/834530/file/vmmwyR7c4JLlGB/flow_field.csv
  EXPECTED_MD5: f2e18e754092c2e8e78eb71eaacdf407

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download BCO-DMO experimental CSV
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 6 --retry-delay 5 --retry-all-errors \
            --connect-timeout 30 --max-time 1200 \
            -A 'Mozilla/5.0 (compatible; research-data-retrieval/1.0)' \
            "$DATA_URL" -o flow_field.csv
          ls -lh flow_field.csv
      - name: Verify checksum and basic CSV integrity
        shell: bash
        run: |
          set -euo pipefail
          ACTUAL_MD5="$(md5sum flow_field.csv | awk '{print $1}')"
          echo "MD5=$ACTUAL_MD5"
          test "$ACTUAL_MD5" = "$EXPECTED_MD5"
          test -s flow_field.csv
          head -n 2 flow_field.csv
      - name: Package CSV
        shell: bash
        run: |
          set -euo pipefail
          zip -0 flow_field.zip flow_field.csv
          sha256sum flow_field.csv > SHA256SUMS.txt
      - name: Upload transient artifact
        uses: actions/upload-artifact@v4
        with:
          name: bco-dmo-flow-field
          path: |
            flow_field.zip
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
